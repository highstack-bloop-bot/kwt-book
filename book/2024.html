ges/DDTHV4FzVhX_5.jpg", "ar": 0.802, "video": false}, {"src": "images/DDTHV4FzVhX_6.jpg", "ar": 0.8, "video": false}]}, {"code": "DDTHcNpz0kU", "date": "December 8, 2024", "iso": "2024-12-08", "month": "December 2024", "loc": "Bangkok, Thailand", "caption": "", "photos": [{"src": "images/DDTHcNpz0kU_0.jpg", "ar": 0.8, "video": false}, {"src": "images/DDTHcNpz0kU_1.jpg", "ar": 0.802, "video": false}, {"src": "images/DDTHcNpz0kU_2.jpg", "ar": 0.8018, "video": false}]}, {"code": "DDTHdDbTzns", "date": "December 8, 2024", "iso": "2024-12-08", "month": "December 2024", "loc": "Bangkok, Thailand", "caption": "", "photos": [{"src": "images/DDTHdDbTzns_0.jpg", "ar": 1.3333, "video": false}, {"src": "images/DDTHdDbTzns_1.jpg", "ar": 1.3333, "video": false}]}, {"code": "DDTHd5tTccK", "date": "December 8, 2024", "iso": "2024-12-08", "month": "December 2024", "loc": "Bangkok, Thailand", "caption": "", "photos": [{"src": "images/DDTHd5tTccK_0.jpg", "ar": 0.8, "video": false}]}, {"code": "DDZeJI8TPPc", "date": "December 10, 2024", "iso": "2024-12-10", "month": "December 2024", "loc": "Bangkok, Thailand", "caption": "When you’ve got two completely different children", "photos": [{"src": "images/DDZeJI8TPPc_0.jpg", "ar": 0.8, "video": false}, {"src": "images/DDZeJI8TPPc_1.jpg", "ar": 0.8, "video": false}]}];
const META = {"year": 2024, "posts": 258, "photos": 625, "range": "January 12 &ndash; December 10, 2024", "cover": "images/C6wEL2wrTmG_0.jpg", "topics": ["The big camper road trip &mdash; Minnesota, the Badlands, Yellowstone, Grand Teton", "Stranded in Jackson, Wyoming &mdash; then white-water rafting", "Beijing &mdash; the Great Wall and the Forbidden City", "Japanese lessons and piano", "Harry Potter finally lands with Winston"], "heroes": ["images/C1-8qWQuqnZ_0.jpg", "images/C5CvMMlSPHx_1.jpg", "images/C9ybU4rNCDf_0.jpg", "images/C-N6ahvumn8_0.jpg", "images/DDTG_5Xzmrt_0.jpg"], "afterword": ["<p class=\"kick\">Afterword</p><h1>A childhood, as its own record keeps it</h1><p class=\"deck\">Seven years, 1,437 posts, read end to end</p><div class=\"rule\"></div><div class=\"cols\"><p>This book was made from an Instagram account, <i>kiddoswhotravel</i>, kept between\n        22 May 2018 and 10 December 2024:\n        1,437 posts, 2,915 photographs and 161 short films,\n        made on 499 separate days &mdash; one day in\n        five.</p><p>Read end to end it is not a travel account. It is the record of a childhood that\n        happened to be lived across twelve countries. Winston is five\n        in the first photograph and twelve in the last; Ella is four, and ten. The account keeps\n        four chapters.</p><p>The first is <b>Bangkok</b> &mdash; 591 posts to the middle of 2020.\n        A city childhood: the same lobby staff every morning, the same street vendors, school\n        friends who live in the building, Muay Thai in the afternoons, a British curriculum and\n        a Thai class in the same week.</p><p>The second is <b>Wisconsin</b>, 357 posts, and it opens with the\n        loudest thing in the archive &mdash; 60 days of nothing, 10 June to\n        9 August 2020, which is the sound of a family moving to the other side of\n        the world. What follows is a deliberate second education: soccer seasons, county fairs,\n        a museum every other week, a plant stall the children run themselves.</p><p>The third is <b>Bangkok again</b>, 221 posts &mdash; home\n        chosen rather than defaulted to, and the travelling now openly the schooling.</p><p>The fourth is <b>Vietnam and Verona</b>, 268 posts, and it\n        begins quietly: twelve days of silence and then, on 9 December 2023, Hanoi above the\n        clouds. This is the only chapter with two homes at once. Vietnam is where most of the\n        days are spent, but the Wisconsin house is never given up, and the year is lived going\n        back and forth &mdash; a Saigon January, a Yellowstone June out of Verona, a Vietnamese\n        August, a Bangkok December. Bangkok does not disappear either; it becomes somewhere\n        they go back to. The schooling still sets the itinerary: Yellowstone came out of a unit\n        on the Oregon Trail. This is the chapter the account never announces, and the only one\n        that had to be told to the book rather than read out of it.</p><p>None of it is drifting. 661 posts keep Bangkok time,\n        375 the American Midwest&rsquo;s and 165\n        Vietnam&rsquo;s; almost everything else is a trip taken from one of those homes and\n        returned from. Spokes, not a road.</p><p>Being from two places is work, and the archive shows the working. Asian dolls bought\n        because the shelves in neither country carried enough of them. The &ldquo;American\n        Pencil&rdquo;, as Winston named it, in the first week of a Wisconsin school. A favourite\n        American buffet in Bangkok; &ldquo;Thai food&rdquo; &mdash; her quotation marks &mdash;\n        for dinner in Verona.</p><p>And the subject is not the places. Counted across every caption,\n        <b>friends</b> appears 35 times, <b>school</b> 36,\n        <b>sleepover</b> 15 &mdash; and the word <b>trip</b> 13. For a\n        travel account that is the tell. The trips are the setting. The plot is company.</p><p>The writing is short and plural. Captions average 9.2 words;\n        527 posts carry none at all. <i>We</i> and <i>our</i> appear\n        211 times against 115 for <i>they</i> and 106 for <i>I</i>. The\n        person holding the camera is hardly ever in the photograph and hardly ever out of the\n        sentence. The single most-used word in seven years of writing is\n        <b>kids</b>, 51 times.</p><p>The hardest page is 30 May 2021: emergency one-year passports, a petition to the\n        embassy, lawyers in Washington, and the flat sentence at the end of it &mdash;\n        <i>the law is power</i>. It quietly re-reads the second chapter. Not a relocation. An\n        exit. Which makes the third chapter a decision.</p><p>The book stops before the story does. Some months after the last photograph the\n        family left Vietnam, sold the house in Verona, and moved to the Bay Area &mdash; around\n        October 2025. Both of the homes in the fourth chapter are let go at once, which is why\n        that chapter reads differently from here: not a settling, a last long season of having\n        two places before choosing a third. None of it is in the archive. It is written down\n        because a photograph cannot say what happened next.</p><p>What the record cannot hold is the ordinary 1,895 days\n        it says nothing about, and the 527 pictures that were never explained.\n        A photograph is evidence that you were there. It does not say what it was like. That\n        part belongs to the four people in it.</p></div><p class=\"sign\">Kiddos Who Travel &middot; 2018&ndash;2024</p>", "<p class=\"kick\">The record</p><h1>Everything, counted</h1><p class=\"deck\">Posts by month &mdash; the bands are the four chapters</p><div class=\"rule\"></div><div class=\"big\"><div><span class=\"v\">1,437</span><span class=\"l\">posts</span></div><div><span class=\"v\">2,915</span><span class=\"l\">photographs</span></div><div><span class=\"v\">161</span><span class=\"l\">films</span></div><div><span class=\"v\">499</span><span class=\"l\">days posted</span></div><div><span class=\"v\">910</span><span class=\"l\">captions</span></div><div><span class=\"v\">144</span><span class=\"l\">places named</span></div><div><span class=\"v\">12</span><span class=\"l\">countries</span></div><div><span class=\"v\">17</span><span class=\"l\">time zones</span></div></div><div class=\"chart\"><p class=\"peak\">Busiest month &middot; April 2023, 75 posts</p><div class=\"bars\"><i style='height:61.3%'></i><i style='height:40.0%'></i><i style='height:54.7%'></i><i style='height:30.7%'></i><i style='height:52.0%'></i><i style='height:68.0%'></i><i style='height:22.7%'></i><i style='height:94.7%'></i><i style='height:36.0%'></i><i style='height:36.0%'></i><i style='height:16.0%'></i><i style='height:36.0%'></i><i style='height:38.7%'></i><i style='height:46.7%'></i><i style='height:20.0%'></i><i style='height:20.0%'></i><i style='height:17.3%'></i><i style='height:10.7%'></i><i style='height:33.3%'></i><i style='height:9.3%'></i><i style='height:13.3%'></i><i style='height:5.3%'></i><i style='height:2.7%'></i><i style='height:0.6%'></i><i style='height:21.3%'></i><i style='height:1.3%'></i><i class='b' style='height:0.6%'></i><i class='b' style='height:21.3%'></i><i class='b' style='height:12.0%'></i><i class='b' style='height:12.0%'></i><i class='b' style='height:12.0%'></i><i class='b' style='height:4.0%'></i><i class='b' style='height:12.0%'></i><i class='b' style='height:5.3%'></i><i class='b' style='height:14.7%'></i><i class='b' style='height:21.3%'></i><i class='b' style='height:26.7%'></i><i class='b' style='height:4.0%'></i><i class='b' style='height:9.3%'></i><i class='b' style='height:22.7%'></i><i class='b' style='height:20.0%'></i><i class='b' style='height:8.0%'></i><i class='b' style='height:16.0%'></i><i class='b' style='height:54.7%'></i><i class='b' style='height:13.3%'></i><i class='b' style='height:5.3%'></i><i class='b' style='height:17.3%'></i><i class='b' style='height:12.0%'>< ss=\"s\">Mar 2023 &ndash; Nov 2023</td></tr><tr><td>Vietnam and Verona</td><td class=\"n\">268</td><td class=\"s\">Dec 2023 &ndash; Dec 2024</td></tr></table></section><section><h2>Most-used words</h2><table><tr><td>kids</td><td class=\"n\">51</td><td class=\"s\">times</td></tr><tr><td>first</td><td class=\"n\">44</td><td class=\"s\">times</td></tr><tr><td>school</td><td class=\"n\">36</td><td class=\"s\">times</td></tr><tr><td>friends</td><td class=\"n\">35</td><td class=\"s\">times</td></tr><tr><td>time</td><td class=\"n\">35</td><td class=\"s\">times</td></tr><tr><td>trip</td><td class=\"n\">13</td><td class=\"s\">times</td></tr></table></section><section><h2>The voice</h2><table><tr><td>Captions written</td><td class=\"n\">910</td></tr><tr><td>Posted without words</td><td class=\"n\">527</td></tr><tr><td>Average caption</td><td class=\"n\">9.2 words</td></tr><tr><td>&ldquo;we&rdquo;, &ldquo;our&rdquo;, &ldquo;us&rdquo;</td><td class=\"n\">211</td></tr><tr><td>&ldquo;they&rdquo;, &ldquo;their&rdquo;, &ldquo;them&rdquo;</td><td class=\"n\">115</td></tr><tr><td>&ldquo;I&rdquo;, &ldquo;my&rdquo;, &ldquo;me&rdquo;</td><td class=\"n\">106</td></tr></table></section></div>"], "routes": [{"iso": "2024-03-26", "html": "<p class=\"nd\">March 26, 2024</p><div class=\"bd\"><p>I am so impressed with my kids’ school. Today, my fourth grader learned about federalism and the US government. I listened in on her lecture and it was taught in a way that was detailed but easy to understand. It’s so impressive to hear 9 year olds accurately talk about the supremacy clause and how the US government functions at different levels.</p><p>Every week they exclaim to me that they’re learning so much and I love that</p></div>", "cls": "ntb"}]};
</script>
<script>
const P = { w: 11.250000, h: 8.250000, bleed: 0.125000 };
const M = { top: P.bleed + 0.30, bottom: P.bleed + 0.34,
            left: P.bleed + 0.30, right: P.bleed + 0.30 };
const CW = P.w - M.left - M.right;          // live content width
const CH = P.h - M.top - M.bottom;          // live content height
const GAP = 0.17;                           // gutter between photos
const CHUNK = 4;                            // most of one post's photos kept in a single block
const MAX_PER_ROW = 8;                      // MIN_ROW is the real limit; this is a safety rail
const MAX_GROUPS_PER_ROW = 5;               // how many separate posts may share a row
const CAP_GAP = 0.055;                      // photo -> its caption
const ROW_PAD = 0.24;                       // caption -> next row of photos
const MONTH_H = 0.30;
const ROUTE_H = 1.480000;                  // a route band heads its page; photographs take the rest
const BAND_GAP = 0.20;                      // band -> the first row of photographs beneath it
const BAND_MAX = 7.400000;               // past this a band stops sharing and takes its own page
const MIN_ROW = 1.30, MAX_ROW = 4.6;        // bounds on a justified row's photo height
const ABS_MIN = 0.95;                       // floor for a row that is one unsplittable post
const MAX_SCALE = 1.045;                    // growth the packer may assume when comparing layouts
const MAX_FILL_SCALE = 1.32;                // growth allowed to close a page the packer cannot fill
const MIN_SCALE = 0.86;                     // squeeze allowed to keep a row from spilling to its own page
const MAX_EXTRA = 0.55;                     // widest a between-row gap may open to absorb slack
const MAX_ROWS = 6;
const HERO_EVERY = 9;                       // rhythm: a full-bleed page roughly this often

const book = document.getElementById('book');
const ruler = document.getElementById('ruler');
let page = null, y = 0, pageNo = 0, placed = [];

const inch = v => v.toFixed(4) + 'in';
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function addPage(cls) {
  page = document.createElement('div');
  page.className = 'page' + (cls ? ' ' + cls : '');
  book.appendChild(page);
  pageNo++;
  y = 0;
  return page;
}

function folio() {
  for (const [cls, txt] of [['n', pageNo], ['t', META.year]]) {
    const d = document.createElement('div');
    d.className = 'folio ' + cls;
    d.textContent = txt;
    page.appendChild(d);
  }
}

/* ---- content model -------------------------------------------------------
   A group is one post's photos (split into chunks of at most MAX_PER_ROW) kept adjacent so
   they still read as a single moment. Only the first chunk carries the date and caption. */
const HEROES = new Set(META.heroes || []);

function groups() {
  const out = [];
  let month = null;
  for (const post of DATA) {
    const fresh = post.month !== month;
    month = post.month;
    let first = true;
    for (let k = 0; k < post.photos.length; k += CHUNK) {
      const photos = post.photos.slice(k, k + CHUNK);
      out.push({
        post, photos, lead: first,
        // A picked photo also gets a full-bleed page, but it stays here in the grid so the
        // post is never broken apart around it.
        picks: photos.filter(ph => HEROES.has(ph.src)),
        monthStart: fresh && first ? post.month : null,
        n: photos.length,
        sum: photos.reduce((s, p) => s + p.ar, 0),
      });
      first = false;
    }
  }
  return out;
}

const capHTML = (g) => !g.lead ? '' :
  '<span class="gdate">' + esc(g.post.date) + '</span>' +
  (g.post.loc ? '<span class="gloc">' + esc(g.post.loc) + '</span>' : '') +
  (g.post.caption ? '<span class="gtext">' + esc(g.post.caption).replace(/\n/g, '<br>') + '</span>' : '');

/* Caption height depends on the width the group ends up with, and the packer asks for it
   thousands of times while searching, so measurements are cached per width bucket. */
const capCache = new Map();
function capHeight(g, w) {
  if (!g.lead) return 0;
  const key = g.post.code + '|' + Math.round(w * 12);
  let h = capCache.get(key);
  if (h === undefined) {
    const d = document.createElement('div');
    d.className = 'gcap';
    d.style.width = inch(w);
    d.innerHTML = capHTML(g);
    ruler.appendChild(d);
    h = d.getBoundingClientRect().height / 96;
    ruler.removeChild(d);
    capCache.set(key, h);
  }
  return h;
}

/* ---- justified rows ------------------------------------------------------ */
const heightOf = (n, sum) => (CW - GAP * (n - 1)) / sum;

/* One candidate row: groups i..j-1 justified across the full column width. Returns null when
   that combination cannot span the column at a sane photo height, so the packer never
   produces a row sitting centred with dead margins either side. */
function rowAt(gs, i, j) {
  let n = 0, sum = 0;
  for (let k = i; k < j; k++) {
    if (k > i && gs[k].monthStart) return null;   // a month always opens a row
    n += gs[k].n; sum += gs[k].sum;
    if (n > MAX_PER_ROW) return null;
  }
  const h = heightOf(n, sum);
  // MIN_ROW stops a row being padded out with so many photos that none of them read. A single
  // post that is simply wide is not that case -- its photos cannot be split across rows, so
  // refusing the row would leave the page with no legal layout at all.
  if (h > MAX_ROW || h < (j - i > 1 ? MIN_ROW : ABS_MIN)) return null;
  const cur = gs.slice(i, j);
  const capH = cur.reduce((m, g) => Math.max(m, capHeight(g, h * g.sum + GAP * (g.n - 1))), 0);
  return { gs: cur, h, sum, n, capH, full: true, end: j,
           block: h + (capH ? CAP_GAP + capH : 0) };
}

/* A group too tall to justify across the column (a lone portrait) has no valid row, so it is
   placed at MAX_ROW and centred. Only ever reached as a fallback; heroPage catches most. */
function looseRow(gs, i) {
  let n = 0, sum = 0, j = i;
  while (j < gs.length && n + gs[j].n <= MAX_PER_ROW && (j === i || !gs[j].monthStart)) {
    n += gs[j].n; sum += gs[j].sum; j++;
    if (heightOf(n, sum) <= MAX_ROW) break;
  }
  const h = Math.min(heightOf(n, sum), MAX_ROW);
  const cur = gs.slice(i, j);
  const capH = cur.reduce((m, g) => Math.max(m, capHeight(g, h * g.sum + GAP * (g.n - 1))), 0);
  return { gs: cur, h, sum, n, capH, full: heightOf(n, sum) <= MAX_ROW, end: j,
           block: h + (capH ? CAP_GAP + capH : 0) };
}

/* The page is the unit that has to look right, so rather than filling rows greedily until the
   next one overflows -- which is what left a dead band at the foot of every page -- every way
   of cutting the upcoming groups into rows is considered and the one putting the most
   photograph on the page wins.

   What is maximised is photo area, not height used: captions and gutters consume the page
   without showing a single picture, so a layout that merely reaches the bottom margin can
   still look empty. Rows that end short are then scaled up to square the page off, so the
   real objective is min(nat * MAX_SCALE, avail) -- and since avail = budget - block + nat,
   both terms depend only on (block used, photo height accumulated). Carrying the
   non-dominated (block, nat) pairs at each cut point therefore finds the true optimum. */
function packRows(gs, start, budget, minO) {
  const K = Math.min(gs.length - start, 26);
  const front = Array.from({ length: K + 1 }, () => []);
  front[0].push({ block: 0, nat: 0, photos: 0, rows: [] });

  const offer = (j, e) => {
    const f = front[j];
    for (const o of f) if (o.block <= e.block + 1e-9 && o.nat >= e.nat - 1e-9) return;
    for (let k = f.length - 1; k >= 0; k--) {
      if (e.block <= f[k].block + 1e-9 && e.nat >= f[k].nat - 1e-9) f.splice(k, 1);
    }
    f.push(e);
    if (f.length > 40) { f.sort((a, b) => a.block - b.block); f.length = 40; }
  };

  for (let o = 0; o < K; o++) {
    for (const from of front[o]) {
      if (from.rows.length >= MAX_ROWS) continue;
      for (let j = o + 1; j <= Math.min(o + MAX_GROUPS_PER_ROW, K); j++) {
        const r = rowAt(gs, start + o, start + j);
        if (!r) continue;
        const rule = from.rows.length && gs[start + o].monthStart ? MONTH_H : 0;
        const pad = (from.rows.length ? ROW_PAD : 0) + rule;
        const block = from.block + pad + r.block;
        const nat = from.nat + r.h;
        // Photo height can be squeezed a little (the crop is invisible), captions cannot, so
        // the page fits if the rows still clear the budget at their most compressed.
        if (block - nat * (1 - MIN_SCALE) > budget + 1e-6) continue;
        const row = Object.assign({}, r, { pad, rule: rule ? gs[start + o].monthStart : null });
        offer(j, { block, nat, photos: from.photos + r.n,
                   rows: from.rows.concat([row]) });
      }
    }
  }

  let pick = null, bestScore = -Infinity;
  for (let o = Math.max(1, minO || 1); o <= K; o++) {
    for (const e of front[o]) {
      const avail = budget - e.block + e.nat;
      const score = Math.min(e.nat * MAX_SCALE, avail) + 0.004 * e.photos;
      if (score > bestScore) { bestScore = score; pick = e; }
    }
  }
  if (!pick) return null;
  const end = start + pick.rows.reduce((s, r) => s + r.gs.length, 0);
  return { rows: pick.rows, end, height: pick.block };
}

/* Occasionally a post cannot start any legal row -- a lone portrait is far too tall to justify
   across the column, and the posts after it cannot be borrowed to shorten it. It gets placed
   at its natural size and the packer then carries on with the rest of the page, because
   letting it end the page is exactly what used to leave three inches of white below it. */
function fillPage(gs, start, budget, minO) {
  const packed = packRows(gs, start, budget, minO);
  if (packed) return packed;
  if (minO) return null;
  const r = looseRow(gs, start);
  r.pad = 0; r.rule = null;
  const rows = [r];
  let end = r.end, height = r.block;
  const rest = packRows(gs, r.end, budget - r.block - ROW_PAD);
  if (rest && rest.rows.length) {
    rest.rows[0].pad = ROW_PAD;
    rows.push.apply(rows, rest.rows);
    end = rest.end;
    height += ROW_PAD + rest.height;
  }
  return { rows, end, height };
}

/* ---- rendering ----------------------------------------------------------- */
function groupEl(g, hNat, hBox) {
  const cell = document.createElement('div');
  cell.className = 'grp';
  cell.style.width = inch(hNat * g.sum + GAP * (g.n - 1));
  const pics = document.createElement('div');
  pics.className = 'pics';
  pics.style.height = inch(hBox);
  for (const ph of g.photos) {
    const f = document.createElement('figure');
    f.style.width = inch(hNat * ph.ar);
    f.innerHTML = '<img src="' + ph.src + '" alt="" loading="eager">' +
                  (ph.video ? '<span class="vtag"></span>' : '');
    pics.appendChild(f);
  }
  cell.appendChild(pics);
  const cap = document.createElement('div');
  cap.className = 'gcap';
  cap.innerHTML = capHTML(g);
  cell.appendChild(cap);
  return cell;
}

function rowEl(row, scale) {
  const el = document.createElement('div');
  el.className = 'row';
  const w = row.full ? CW : row.h * row.sum + GAP * (row.n - 1);
  el.style.width = inch(w);
  el.style.left = inch(M.left + (CW - w) / 2);
  row.gs.forEach(g => el.appendChild(groupEl(g, row.h, row.h * scale)));
  return el;
}

function monthRule(name, top) {
  const m = document.createElement('div');
  m.className = 'month';
  m.style.left = inch(M.left);
  m.style.width = inch(CW);
  m.style.top = inch(top);
  m.textContent = name;
  return m;
}

function renderPage(fill, budget, top0) {
  const rows = fill.rows;
  const pads = rows.reduce((s, r) => s + r.pad, 0);
  const caps = rows.reduce((s, r) => s + (r.capH ? CAP_GAP + r.capH : 0), 0);
  const nat = rows.reduce((s, r) => s + r.h, 0);
  const avail = budget - pads - caps;
  // Square the page off: grow the photos a touch (the cover crop hides it), then spend whatever
  // is still left widening the gaps between rows, and only centre what even that cannot absorb.
  let scale = nat > 0 && isFinite(nat) ? avail / nat : 1;
  scale = Math.max(MIN_SCALE, Math.min(scale, MAX_FILL_SCALE));
  const slack = Math.max(0, avail - nat * scale);
  const gaps = rows.length - 1;
  const extra = gaps > 0 ? Math.min(slack / gaps, MAX_EXTRA) : 0;
  let y = top0 + (slack - extra * gaps) / 2;
  rows.forEach((r, i) => {
    y += r.pad + (i ? extra : 0);
    if (r.rule) { page.appendChild(monthRule(r.rule, y - MONTH_H + 0.06)); }
    const el = rowEl(r, scale);
    el.style.top = inch(y);
    page.appendChild(el);
    y += r.h * scale + (r.capH ? CAP_GAP + r.capH : 0);
  });
}

/* A full-bleed page every so often gives the book a pulse instead of grid after grid. */
function heroOK(g) {
  return g && g.lead && g.n === 1 && g.photos[0].ar >= 1.25 && !g.monthStart;
}

function heroPage(p, photo, why, withCap) {
  addPage('full');
  page.dataset.why = why || 'picked';
  page.innerHTML =
    '<img class="bleed" src="' + photo.src + '" alt="">' +
    '<div class="hscrim"></div>' +
    '<div class="hcap"><span class="gdate">' + esc(p.date) + '</span>' +
    (p.loc ? '<span class="gloc">' + esc(p.loc) + '</span>' : '') +
    // The caption prints once. A picked photo still appears in the grid with its post, which
    // is where the caption belongs, so the feature page carries only date and place.
    (withCap && p.caption
      ? '<span class="gtext">' + esc(p.caption).replace(/\n/g, '<br>') + '</span>' : '') +
    '</div>';
  folio();
}

function openerPage() {
  addPage('full');
  page.innerHTML =
    '<img class="bleed" src="' + META.cover + '" alt="">' +
    '<div class="scrim"></div>' +
    '<div class="opener"><p class="kick">Winston and Eleanor</p>' +
    '<p class="yr">' + META.year + '</p>' +
    '<p class="sub">' + META.posts + ' posts &middot; ' + META.photos + ' photographs</p>' +
    '<p class="sub">' + META.range + '</p>' +
    (META.topics && META.topics.length
      ? '<ul class="topics">' + META.topics.map(t => '<li>' + t + '</li>').join('') + '</ul>'
      : '') + '</div>';
}

/* A hand-written route, as a strip across the head of a page. It is measured rather than
   given a page: seven lines of itinerary cannot carry 11x8in alone, and the trip reads
   better with its own first photographs underneath it. */
function routeBand(html, top, cls) {
  const b = document.createElement('div');
  b.className = cls || 'rtb';
  b.style.left = inch(M.left);
  b.style.width = inch(CW);
  b.style.top = inch(top);
  b.innerHTML = html;
  return b;
}

/* A route is one fixed size; a post whose photographs the archive lost is however long Cat
   wrote it. So a band is measured off the ruler before the page commits to carrying it. */
const bandCache = new Map();
function bandHeight(b) {
  let h = bandCache.get(b.html);
  if (h === undefined) {
    const d = routeBand(b.html, 0, b.cls);
    d.style.position = 'static';
    ruler.appendChild(d);
    h = d.getBoundingClientRect().height / 96 + BAND_GAP;
    ruler.removeChild(d);
    bandCache.set(b.html, h);
  }
  return h;
}

/* A route anchored past the last photograph of the volume still has to print. The 'full'
   marker keeps the page out of the audit that checks every photograph reached a page. */
function routePage(b) {
  addPage('full');
  page.appendChild(routeBand(b.html, M.top, b.cls));
  folio();
}

function layout() {
  openerPage();
  const gs = groups();
  const pending = [];                            // picks waiting for a page of their own
  const routes = (META.routes || []).slice();    // hand-written itineraries, in date order
  let i = 0, sinceHero = 0, lastFull = true;     // the opener is itself a full-bleed page
  while (i < gs.length) {
    // A route heads the trip it describes, so it takes the top of that trip's first page and
    // the photographs of the trip fill the rest of it.
    const band = [];
    while (routes.length && gs[i].post.iso >= routes[0].iso) band.push(routes.shift());
    // A band longer than the page can usefully share is given its own page rather than
    // squeezing the day's photographs into a strip at the foot of the sheet.
    let bandH = 0;
    for (const b of band) bandH += bandHeight(b);
    while (band.length && bandH > BAND_MAX) {
      routePage(band.shift());
      bandH = 0;
      for (const b of band) bandH += bandHeight(b);
    }
    // A feature page carries one photograph and no room for a band, so the rhythm waits a page.
    if (!band.length && !HEROES.size && !lastFull && sinceHero >= HERO_EVERY && heroOK(gs[i])) {
      heroPage(gs[i].post, gs[i].photos[0], 'rhythm', gs[i].lead);
      i++; sinceHero = 0; lastFull = true;
      continue;
    }
    addPage();
    folio();
    let top = M.top, budget = CH;
    for (const b of band) {
      page.appendChild(routeBand(b.html, top, b.cls));
      const h = bandHeight(b);
      top += h;
      budget -= h;
    }
    if (gs[i].monthStart) {
      page.appendChild(monthRule(gs[i].monthStart, top));
      top += MONTH_H;
      budget -= MONTH_H;
    }
    // A route page has to introduce its trip, so no photo page may straddle the anchor date.
    // The packer is shown only the groups in front of it; without this a page beginning on
    // the 19th ran on through the 24th and the route printed in the middle of its own trip.
    const bnd = routes.length ? gs.findIndex(g => g.post.iso >= routes[0].iso) : -1;
    const view = bnd > i ? gs.slice(0, bnd) : gs;
    let fill = fillPage(view, i, budget);
    // A photo that would be left alone on the next page has nowhere to go: rather than hand it
    // a full page it never earned, pull it back onto this one, even if this page then carries
    // less photograph than its best arrangement.
    if (fill.end < view.length) {
      const nxt = fillPage(view, fill.end, CH);
      if (nxt && nxt.rows.length === 1 && !nxt.rows[0].full && nxt.rows[0].n === 1) {
        const wider = fillPage(view, i, budget, fill.end + 1 - i);
        if (wider) fill = wider;
      }
    }
    // A single photo that cannot justify across the column would sit marooned in white,
    // so it takes the page full-bleed instead - unless a route band heads this page, since
    // going full-bleed drops the page and would take the band down with it.
    if (!band.length && fill.rows.length === 1 && !fill.rows[0].full && fill.rows[0].n === 1) {
      const g = fill.rows[0].gs[0];
      page.remove(); pageNo--;
      heroPage(g.post, g.photos[0], 'stranded', g.lead);
      i = fill.end; sinceHero = 0; lastFull = true;
      continue;
    }
    renderPage(fill, budget, top);
    for (let k = i; k < fill.end; k++) {
      for (const ph of gs[k].picks) pending.push({ post: gs[k].post, photo: ph });
    }
    i = fill.end;
    sinceHero++;
    lastFull = false;
    // At most one feature page per grid page, so two full-bleed pages never sit together -
    // the year opener followed straight by a feature read as a double.
    if (pending.length) {
      const pk = pending.shift();
      heroPage(pk.post, pk.photo, 'picked', false);
      lastFull = true;
    }
  }
  while (pending.length) {
    const pk = pending.shift();
    heroPage(pk.post, pk.photo, 'picked', false);
  }
  // A route anchored past the last post of the volume still has to print somewhere.
  while (routes.length) routePage(routes.shift());
  for (const html of (META.afterword || [])) {
    addPage('aw full');
    page.innerHTML = html;
    folio();
  }
}

/* Caption heights drive the packing and they are wrong until the fonts are in, which made the
   same book paginate differently from one run to the next. Waiting on document.fonts.ready is
   not enough: with no text on the page yet, nothing has requested a font, so it resolves
   immediately and layout still measures fallback metrics. Each face is therefore requested
   explicitly and awaited before a single row is packed. */
const FACES = ['300 16px Inter', '400 16px Inter', '300 16px Fraunces', '400 16px Fraunces'];

function run() {
  layout();
  document.body.dataset.pages = document.querySelectorAll('.page').length;
}

if (document.fonts && document.fonts.load) {
  Promise.all(FACES.map(f => document.fonts.load(f, 'Aa0')))
    .then(() => document.fonts.ready)
    .then(run, run);
} else {
  run();
}
</script>
</body></html>
