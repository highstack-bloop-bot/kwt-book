CnIORaTOGqv", "date": "January 7, 2023", "iso": "2023-01-07", "month": "January 2023", "loc": "", "caption": "", "photos": [{"src": "images/CnIORaTOGqv_0.jpg", "ar": 1.0786, "video": false}, {"src": "images/CnIORaTOGqv_1.jpg", "ar": 1.0778, "video": true}]}, {"code": "CnXre5BOVvd", "date": "January 13, 2023", "iso": "2023-01-13", "month": "January 2023", "loc": "", "caption": "Games and sleepover at our house today :)", "photos": [{"src": "images/CnXre5BOVvd_0.jpg", "ar": 0.8, "video": false}]}, {"code": "CnXrjzKOgRb", "date": "January 13, 2023", "iso": "2023-01-13", "month": "January 2023", "loc": "", "caption": "", "photos": [{"src": "images/CnXrjzKOgRb_0.jpg", "ar": 1.1442, "video": false}]}, {"code": "CnYTCaVDOIv", "date": "January 13, 2023", "iso": "2023-01-13", "month": "January 2023", "loc": "", "caption": "Play 😊", "photos": [{"src": "images/CnYTCaVDOIv_0.jpg", "ar": 1.2853, "video": false}, {"src": "images/CnYTCaVDOIv_1.jpg", "ar": 1.2837, "video": false}, {"src": "images/CnYTCaVDOIv_2.jpg", "ar": 1.2837, "video": false}, {"src": "images/CnYTCaVDOIv_3.jpg", "ar": 1.2837, "video": false}, {"src": "images/CnYTCaVDOIv_4.jpg", "ar": 1.2837, "video": false}]}, {"code": "Cnce915umU1", "date": "January 15, 2023", "iso": "2023-01-15", "month": "January 2023", "loc": "", "caption": "Milwaukee is Wisconsin’s largest city, it’s an hour away from Madison and twice as big (in terms of population). The overall feel of the downtown area reminds me of a mini Chicago. We’ve been a few times but not even close to thoroughly exploring it.\nWinston’s been into magic lately and there happened to be a magic show touring in Milwaukee so I decided to make a day trip out of it today.\nWe arrived early and went to a children’s museum first, Discovery World— beautifully located right on Lake Michigan. It’s a small but high tech science museum with a similarly small but impressive aquarium. The kids got to play with electricity, pet sturgeons and sting rays, and see live axolotl.\nMilwaukee doesn’t have *alot* of museums but the museums that it does have are pretty great. I LOVE the Public Museum and would recommend it to anyone visiting MKE. I’ve never been able to make it through the entire building in one trip, and try to go as often as possible since it is shutting down in a couple years (technically moving but the new location is not going to be the same at all).\nFor lunch we had Cuban food and it was beyond delicious. We tried a sampler plate of plantains cooked 3 different ways and the usual Cuban dishes. The kids devoured their food.\nOur show started at 2:30 and it was our first time in the Milwaukee theatre. I booked this thinking it would be just something the kids would enjoy but it turned out to be one of the best shows we have ever watched, it blew our minds! There was a standing ovation from the crowd and the kids gushed about the magic for hours afterwards. I have never heard them gush about anything and they’ve seen lots of cool things. I highly recommend Champions of Magic if it’s showing near you.\nFor dinner we all had Ethiopian food for the first time. I have no point of reference but it seemed pretty authentic and we had a great experience. Guests don’t eat on regular tables but on an elevated woven basket like thing and with bare hands. We read about the country of Ethiopia while we waited for our food. I was vigilant about hand washing since I knew we were about to eat without utensils . The food was yummy, I was happy that both of them eagerly tried all of the different samples even though they’d never seen it before. We enjoyed all the new flavors. This particular place (Ethiopian Cottage Village) is consistently rated as a top MKE restaurant and people apparently drive for hours to dine here so I’m glad it was mere minutes away from the theatre.\nAll in all, a very satisfying cultural day, or as the kids kept saying, “very entertaining!”.\nVisit Milwaukee if you ever get the chance, with or without kids", "photos": [{ otos": [{"src": "images/CqFXo1qSH9q_0.jpg", "ar": 1.3333, "video": false}, {"src": "images/CqFXo1qSH9q_1.jpg", "ar": 1.3333, "video": false}]}, {"code": "CqFXr40SYd-", "date": "March 22, 2023", "iso": "2023-03-22", "month": "March 2023", "loc": "", "caption": "", "photos": [{"src": "images/CqFXr40SYd-_0.jpg", "ar": 0.8, "video": false}, {"src": "images/CqFXr40SYd-_1.jpg", "ar": 0.8, "video": false}]}, {"code": "CqFXu2_Sjp7", "date": "March 22, 2023", "iso": "2023-03-22", "month": "March 2023", "loc": "", "caption": "", "photos": [{"src": "images/CqFXu2_Sjp7_0.jpg", "ar": 1.3333, "video": false}]}, {"code": "CqFXxRHSbgG", "date": "March 22, 2023", "iso": "2023-03-22", "month": "March 2023", "loc": "", "caption": "", "photos": [{"src": "images/CqFXxRHSbgG_0.jpg", "ar": 0.8, "video": false}]}, {"code": "CqFX5r9SgjA", "date": "March 22, 2023", "iso": "2023-03-22", "month": "March 2023", "loc": "", "caption": "A little pampering 🤭", "photos": [{"src": "images/CqFX5r9SgjA_0.jpg", "ar": 0.8, "video": false}, {"src": "images/CqFX5r9SgjA_1.jpg", "ar": 0.802, "video": false}, {"src": "images/CqFX5r9SgjA_2.jpg", "ar": 0.8, "video": false}, {"src": "images/CqFX5r9SgjA_3.jpg", "ar": 0.8, "video": false}, {"src": "images/CqFX5r9SgjA_4.jpg", "ar": 0.8, "video": false}, {"src": "images/CqFX5r9SgjA_5.jpg", "ar": 0.8, "video": false}]}, {"code": "CqFYZqRSEAo", "date": "March 22, 2023", "iso": "2023-03-22", "month": "March 2023", "loc": "", "caption": "What’s the opposite of perfect attendance? Cause my kids win that for sure\nIMO though, travel is the best education. Nothing like some real life experience.\nWe made a quick stop in Qatar where they rode camels in the famed Arabian market and had some real middle eastern food (the best hummus we’ve ever had).\nLanded in HCM and explored the late night walking streets and had some pho at 4 in the morning. After a few days we flew to the northern islands where we stayed at the most beautiful ocean view resort and took a cruise to see the hundreds of limestone islands and kayaked to private beaches.\nWhen we returned to civilzation in Hanoi, we got some blank journals and they’re required to keep a book of their travels. They have identified the names, flags, and locations of the countries of South East Asia. Every day they write an entry on what they did and their observation of the different landscapes they have seen.\nThey grew up in this environment but it’s been 3 years since we left the US. Now they’re older and able to think on a higher level and have a better understanding. They’re using their phones to navigate us through the chaotic streets. They calculate the exchange rates and learn the value of money. They see the cultural differences in each place we go and are learning to traverse through the motorbike filled streets of VN.\nThey see everything from high end hotels to remote fishing villages of varying construct. The disparity of living between the privileged and those less so. It helps a person to not take things for granted, I think. I told my son there is very little difference between the foreigner on vacation, and the ones working in the village-- merely the luck of being born into more privileged circumstances. If you are lucky enough to have an education, use it to make the world a better place.\nIn school they had units on country life v city life, on countries, math, science, humanities, history etc. Now, we live it\nMissed this life quite a bit and glad to be back, if only for a while.", "photos": [{"src": "images/CqFYZqRSEAo_0.jpg", "ar": 0.8, "video": false}, {"src": "images/CqFYZqRSEAo_1.jpg", "ar": 0.8, "video": false}, {"src": "images/CqFYZqRSEAo_2.jpg", "ar": 0.8, "video": false}, {"src": "images/CqFYZqRSEAo_3.jpg", "ar": 0.8, "video": false}]}, {"code": "CqFYcuKyP-m", "date": "March 22, 2023", "iso": "2023-03-22", "month": "March 2023", "loc": "", "caption": "Hummus was amazing", "photos": [{"src": "images/CqFYcuKyP-m_0.jpg", "ar": 1.3333, "video": false}, {"src": "im const META = {"year": 2023, "posts": 262, "photos": 705, "range": "January 6 &ndash; December 23, 2023", "cover": "images/CrdU1rMSOvm_0.jpg", "topics": ["Back to Bangkok in April", "Vietnam &mdash; Hanoi, Hoi An, Saigon, Sa Pa", "The Alaska cruise &mdash; Ketchikan and Skagway", "Island weekends and lap-swim school mornings"], "heroes": ["images/CnYTCaVDOIv_4.jpg", "images/Crsu8UeSPQ__0.jpg", "images/Ct0VLViOH7l_5.jpg", "images/Cy6ck7FNRL3_0.jpg"], "afterword": [], "routes": [{"iso": "2023-02-07", "html": "<p class=\"nd\">February 7, 2023</p><div class=\"bd\"><p>My daughter came home from school and started complaining because her group of friends at school have been called the “Eggwits” for the last two years. Today another group decided to copy them and name themselves the Eggits.</p><p>She is upset and said this is trademark infringement.</p><p>We started talking about other stuff and then out of nowhere she asks if I can sue them.</p><p>I politely declined</p><p>She lets me know that if I won’t do it she knows a lot of other lawyers. Though she acknowledged she knows a lot of lawyers because of me.</p><p>I think she’s going to be a handful, and both kids are going to be shrewd entrepreneurs</p></div>", "cls": "ntb"}, {"iso": "2023-05-05", "html": "<p class=\"nd\">May 5, 2023</p><div class=\"bd\"><p>Educational diaries:</p><p>Traditional schooling has its benefits, for sure, but education is everywhere. I have no idea if we’re following the regular US curriculum (probably not) but in just the last few weeks:</p><p>An NYU dental surgeon joined us for part of our trip. Winston and Ella got detailed lessons on teeth, and the formation of cavities. We all changed our tooth brushing routine as well.</p><p>We met one of my best friends, CEO of an international company, in a few different cities and they got lessons on energy and business. We toured their new HCM office and the kids found it amusing that they had offices in every country we were in during our trip. They asked about hiring and firing, and listened to our discussions on some of the problems encountered in every day work life.</p><p>After reading about the Khmer Kingdom and the world wonder of Angkor Wat we toured it in person and marveled at the carvings and engineering— which would be hard to replicate even with modern technology and lasers.</p><p>On our way to the airport to go to Taiwan we had an in depth conversation about Ed Sheeran and his copyright trial. I broke down the main arguments of each side and the ramifications of the decision should the plaintiff win. They learned a little about the idea of “precedent” in American law. Both expressed interest in watching the trial.</p><p>We met with a friend who owns a wealth management company and he gave the kids a lesson on probability and strategy while we played board games.</p><p>I’ve watched them grow in confidence and independence as they venture on their own in our old neighborhood, picking up food or other little errands. They are comfortable speaking to adults, expressing their needs to staff, or even standing up for themselves or other kids when necessary (to the dismay of our friends’ nanny I’m sure ).</p><p>They are reconnecting with their childhood friends and meeting a lot of new friends, all of whom come from very diverse backgrounds, all different countries. It’s delightful that no matter how different the kids can be, play and joy are universal.</p><p>They also spend time with lots of adults (mom’s friends) and recognize how many people have gone out of their way to welcome us and meet with us. They’ve loved seeing people they remember, many who we’ve gone on incredible trips with and are forever a part of their childhood memories.</p><p>We’ve been through many airports on this trip and I’ve tasked them with navigating us through by themselves from check in, through security, and to find our gate. They’ve learned about immigration, visas, and passports.</p><p>Winston has grown very interested in business, the concept of money, and regularly gives his thoughts on how a business is run or what makes one business do better than another, or how they might possibly improve.</p><p>At breakfast this morning Ella brought up the various traits of each country she’s been to and they’re both keenly aware that every place has its pros and cons.</p><p>They have very interesting, and often accurate, insight on human behavior, personalities, and motivation.</p><p>Between all this, they’re also doing weekly reading and math, mostly books through Libby and practice on Khan Academy. They’ve also kept up with their travel journal, which is almost full and definitely a keepsake that they’ve worked hard on and are very proud of.</p><p>The substantive facts they are learning (like all the countries in SEA or the history of a place) I often did not know myself until I either looked it up so I could teach them or were taught by friends who specialize in the matter.</p><p>The soft skills they’re acquiring at a young age are, in my opinion, the truly invaluable part of this experience.</p><p>It’s often said that parenting is a thankless job but I have found that to be anything but true. My kids regularly express without prompting how grateful they are. For the food we get to have, the experiences, the gifts, for the fun with friends. It makes my heart full</p><p>I had an internal struggle for months on whether or not to go on this trip and can say with confidence that it was absolutely the best decision</p><p>Next week Ella turns 9 and their childhood will be half over. I hope they take their unique upbringing and choose to lead interesting and fulfilling lives, anywhere in the world.</p></div>", "cls": "ntb"}]};

<script>
const P = { w: 11.250000, h: 8.250000, bleed: 0.125000 };
const M = { top: P.bleed + 0.30, bottom: P.bleed + 0.34,
            left: P.bleed + 0.30, right: P.bleed + 0.30 };
const CW = P.w - M.left - M.right;          // live content width
const CH = P.h - M.top - M.bottom;          // live content height
const GAP = 0.17;                           // gutter between photos
const CHUNK = 4;                            // most of one post's photos kept in a single block
const MAX_PER_ROW = 8;                      // MIN_ROW is the real limit; this is a safety rail
const MAX_GROUPS_PER_ROW = 5;               // how many separate posts may share a row
const CAP_GAP = 0.055;                      // photo -> its caption
const ROW_PAD = 0.24;                       // caption -> next row of photos
const MONTH_H = 0.30;
const ROUTE_H = 1.480000;                  // a route band heads its page; photographs take the rest
const BAND_GAP = 0.20;                      // band -> the first row of photographs beneath it
const BAND_MAX = 7.400000;               // past this a band stops sharing and takes its own page
const MIN_ROW = 1.30, MAX_ROW = 4.6;        // bounds on a justified row's photo height
const ABS_MIN = 0.95;                       // floor for a row that is one unsplittable post
const MAX_SCALE = 1.045;                    // growth the packer may assume when comparing layouts
const MAX_FILL_SCALE = 1.32;                // growth allowed to close a page the packer cannot fill
const MIN_SCALE = 0.86;                     // squeeze allowed to keep a row from spilling to its own page
const MAX_EXTRA = 0.55;                     // widest a between-row gap may open to absorb slack
const MAX_ROWS = 6;
const HERO_EVERY = 9;                       // rhythm: a full-bleed page roughly this often

const book = document.getElementById('book');
const ruler = document.getElementById('ruler');
let page = null, y = 0, pageNo = 0, placed = [];

const inch = v => v.toFixed(4) + 'in';
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function addPage(cls) {
  page = document.createElement('div');
  page.className = 'page' + (cls ? ' ' + cls : '');
  book.appendChild(page);
  pageNo++;
  y = 0;
  return page;
}

function folio() {
  for (const [cls, txt] of [['n', pageNo], ['t', META.year]]) {
    const d = document.createElement('div');
    d.className = 'folio ' + cls;
    d.textContent = txt;
    page.appendChild(d);
  }
}

/* ---- content model -------------------------------------------------------
   A group is one post's photos (split into chunks of at most MAX_PER_ROW) kept adjacent so
   they still read as a single moment. Only the first chunk carries the date and caption. */
const HEROES = new Set(META.heroes || []);

function groups() {
  const out = [];
  let month = null;
  for (const post of DATA) {
    const fresh = post.month !== month;
    month = post.month;
    let first = true;
    for (let k = 0; k < post.photos.length; k += CHUNK) {
      const photos = post.photos.slice(k, k + CHUNK);
      out.push({
        post, photos, lead: first,
        // A picked photo also gets a full-bleed page, but it stays here in the grid so the
        // post is never broken apart around it.
        picks: photos.filter(ph => HEROES.has(ph.src)),
        monthStart: fresh && first ? post.month : null,
        n: photos.length,
        sum: photos.reduce((s, p) => s + p.ar, 0),
      });
      first = false;
    }
  }
  return out;
}

const capHTML = (g) => !g.lead ? '' :
  '<span class="gdate">' + esc(g.post.date) + '</span>' +
  (g.post.loc ? '<span class="gloc">' + esc(g.post.loc) + '</span>' : '') +
  (g.post.caption ? '<span class="gtext">' + esc(g.post.caption).replace(/\n/g, '<br>') + '</span>' : '');

/* Caption height depends on the width the group ends up with, and the packer asks for it
   thousands of times while searching, so measurements are cached per width bucket. */
const capCache = new Map();
function capHeight(g, w) {
  if (!g.lead) return 0;
  const key = g.post.code + '|' + Math.round(w * 12);
  let h = capCache.get(key);
  if (h === undefined) {
    const d = document.createElement('div');
    d.className = 'gcap';
    d.style.width = inch(w);
    d.innerHTML = capHTML(g);
    ruler.appendChild(d);
    h = d.getBoundingClientRect().height / 96;
    ruler.removeChild(d);
    capCache.set(key, h);
  }
  return h;
}

/* ---- justified rows ------------------------------------------------------ */
const heightOf = (n, sum) => (CW - GAP * (n - 1)) / sum;

/* One candidate row: groups i..j-1 justified across the full column width. Returns null when
   that combination cannot span the column at a sane photo height, so the packer never
   produces a row sitting centred with dead margins either side. */
function rowAt(gs, i, j) {
  let n = 0, sum = 0;
  for (let k = i; k < j; k++) {
    if (k > i && gs[k].monthStart) return null;   // a month always opens a row
    n += gs[k].n; sum += gs[k].sum;
    if (n > MAX_PER_ROW) return null;
  }
  const h = heightOf(n, sum);
  // MIN_ROW stops a row being padded out with so many photos that none of them read. A single
  // post that is simply wide is not that case -- its photos cannot be split across rows, so
  // refusing the row would leave the page with no legal layout at all.
  if (h > MAX_ROW || h < (j - i > 1 ? MIN_ROW : ABS_MIN)) return null;
  const cur = gs.slice(i, j);
  const capH = cur.reduce((m, g) => Math.max(m, capHeight(g, h * g.sum + GAP * (g.n - 1))), 0);
  return { gs: cur, h, sum, n, capH, full: true, end: j,
           block: h + (capH ? CAP_GAP + capH : 0) };
}

/* A group too tall to justify across the column (a lone portrait) has no valid row, so it is
   placed at MAX_ROW and centred. Only ever reached as a fallback; heroPage catches most. */
function looseRow(gs, i) {
  let n = 0, sum = 0, j = i;
  while (j < gs.length && n + gs[j].n <= MAX_PER_ROW && (j === i || !gs[j].monthStart)) {
    n += gs[j].n; sum += gs[j].sum; j++;
    if (heightOf(n, sum) <= MAX_ROW) break;
  }
  const h = Math.min(heightOf(n, sum), MAX_ROW);
  const cur = gs.slice(i, j);
  const capH = cur.reduce((m, g) => Math.max(m, capHeight(g, h * g.sum + GAP * (g.n - 1))), 0);
  return { gs: cur, h, sum, n, capH, full: heightOf(n, sum) <= MAX_ROW, end: j,
           block: h + (capH ? CAP_GAP + capH : 0) };
}

/* The page is the unit that has to look right, so rather than filling rows greedily until the
   next one overflows -- which is what left a dead band at the foot of every page -- every way
   of cutting the upcoming groups into rows is considered and the one putting the most
   photograph on the page wins.

   What is maximised is photo area, not height used: captions and gutters consume the page
   without showing a single picture, so a layout that merely reaches the bottom margin can
   still look empty. Rows that end short are then scaled up to square the page off, so the
   real objective is min(nat * MAX_SCALE, avail) -- and since avail = budget - block + nat,
   both terms depend only on (block used, photo height accumulated). Carrying the
   non-dominated (block, nat) pairs at each cut point therefore finds the true optimum. */
function packRows(gs, start, budget, minO) {
  const K = Math.min(gs.length - start, 26);
  const front = Array.from({ length: K + 1 }, () => []);
  front[0].push({ block: 0, nat: 0, photos: 0, rows: [] });

  const offer = (j, e) => {
    const f = front[j];
    for (const o of f) if (o.block <= e.block + 1e-9 && o.nat >= e.nat - 1e-9) return;
    for (let k = f.length - 1; k >= 0; k--) {
      if (e.block <= f[k].block + 1e-9 && e.nat >= f[k].nat - 1e-9) f.splice(k, 1);
    }
    f.push(e);
    if (f.length > 40) { f.sort((a, b) => a.block - b.block); f.length = 40; }
  };

  for (let o = 0; o < K; o++) {
    for (const from of front[o]) {
      if (from.rows.length >= MAX_ROWS) continue;
      for (let j = o + 1; j <= Math.min(o + MAX_GROUPS_PER_ROW, K); j++) {
        const r = rowAt(gs, start + o, start + j);
        if (!r) continue;
        const rule = from.rows.length && gs[start + o].monthStart ? MONTH_H : 0;
        const pad = (from.rows.length ? ROW_PAD : 0) + rule;
        const block = from.block + pad + r.block;
        const nat = from.nat + r.h;
        // Photo height can be squeezed a little (the crop is invisible), captions cannot, so
        // the page fits if the rows still clear the budget at their most compressed.
        if (block - nat * (1 - MIN_SCALE) > budget + 1e-6) continue;
        const row = Object.assign({}, r, { pad, rule: rule ? gs[start + o].monthStart : null });
        offer(j, { block, nat, photos: from.photos + r.n,
                   rows: from.rows.concat([row]) });
      }
    }
  }

  let pick = null, bestScore = -Infinity;
  for (let o = Math.max(1, minO || 1); o <= K; o++) {
    for (const e of front[o]) {
      const avail = budget - e.block + e.nat;
      const score = Math.min(e.nat * MAX_SCALE, avail) + 0.004 * e.photos;
      if (score > bestScore) { bestScore = score; pick = e; }
    }
  }
  if (!pick) return null;
  const end = start + pick.rows.reduce((s, r) => s + r.gs.length, 0);
  return { rows: pick.rows, end, height: pick.block };
}

/* Occasionally a post cannot start any legal row -- a lone portrait is far too tall to justify
   across the column, and the posts after it cannot be borrowed to shorten it. It gets placed
   at its natural size and the packer then carries on with the rest of the page, because
   letting it end the page is exactly what used to leave three inches of white below it. */
function fillPage(gs, start, budget, minO) {
  const packed = packRows(gs, start, budget, minO);
  if (packed) return packed;
  if (minO) return null;
  const r = looseRow(gs, start);
  r.pad = 0; r.rule = null;
  const rows = [r];
  let end = r.end, height = r.block;
  const rest = packRows(gs, r.end, budget - r.block - ROW_PAD);
  if (rest && rest.rows.length) {
    rest.rows[0].pad = ROW_PAD;
    rows.push.apply(rows, rest.rows);
    end = rest.end;
    height += ROW_PAD + rest.height;
  }
  return { rows, end, height };
}

/* ---- rendering ----------------------------------------------------------- */
function groupEl(g, hNat, hBox) {
  const cell = document.createElement('div');
  cell.className = 'grp';
  cell.style.width = inch(hNat * g.sum + GAP * (g.n - 1));
  const pics = document.createElement('div');
  pics.className = 'pics';
  pics.style.height = inch(hBox);
  for (const ph of g.photos) {
    const f = document.createElement('figure');
    f.style.width = inch(hNat * ph.ar);
    f.innerHTML = '<img src="' + ph.src + '" alt="" loading="eager">' +
                  (ph.video ? '<span class="vtag"></span>' : '');
    pics.appendChild(f);
  }
  cell.appendChild(pics);
  const cap = document.createElement('div');
  cap.className = 'gcap';
  cap.innerHTML = capHTML(g);
  cell.appendChild(cap);
  return cell;
}

function rowEl(row, scale) {
  const el = document.createElement('div');
  el.className = 'row';
  const w = row.full ? CW : row.h * row.sum + GAP * (row.n - 1);
  el.style.width = inch(w);
  el.style.left = inch(M.left + (CW - w) / 2);
  row.gs.forEach(g => el.appendChild(groupEl(g, row.h, row.h * scale)));
  return el;
}

function monthRule(name, top) {
  const m = document.createElement('div');
  m.className = 'month';
  m.style.left = inch(M.left);
  m.style.width = inch(CW);
  m.style.top = inch(top);
  m.textContent = name;
  return m;
}

function renderPage(fill, budget, top0) {
  const rows = fill.rows;
  const pads = rows.reduce((s, r) => s + r.pad, 0);
  const caps = rows.reduce((s, r) => s + (r.capH ? CAP_GAP + r.capH : 0), 0);
  const nat = rows.reduce((s, r) => s + r.h, 0);
  const avail = budget - pads - caps;
  // Square the page off: grow the photos a touch (the cover crop hides it), then spend whatever
  // is still left widening the gaps between rows, and only centre what even that cannot absorb.
  let scale = nat > 0 && isFinite(nat) ? avail / nat : 1;
  scale = Math.max(MIN_SCALE, Math.min(scale, MAX_FILL_SCALE));
  const slack = Math.max(0, avail - nat * scale);
  const gaps = rows.length - 1;
  const extra = gaps > 0 ? Math.min(slack / gaps, MAX_EXTRA) : 0;
  let y = top0 + (slack - extra * gaps) / 2;
  rows.forEach((r, i) => {
    y += r.pad + (i ? extra : 0);
    if (r.rule) { page.appendChild(monthRule(r.rule, y - MONTH_H + 0.06)); }
    const el = rowEl(r, scale);
    el.style.top = inch(y);
    page.appendChild(el);
    y += r.h * scale + (r.capH ? CAP_GAP + r.capH : 0);
  });
}

/* A full-bleed page every so often gives the book a pulse instead of grid after grid. */
function heroOK(g) {
  return g && g.lead && g.n === 1 && g.photos[0].ar >= 1.25 && !g.monthStart;
}

function heroPage(p, photo, why, withCap) {
  addPage('full');
  page.dataset.why = why || 'picked';
  page.innerHTML =
    '<img class="bleed" src="' + photo.src + '" alt="">' +
    '<div class="hscrim"></div>' +
    '<div class="hcap"><span class="gdate">' + esc(p.date) + '</span>' +
    (p.loc ? '<span class="gloc">' + esc(p.loc) + '</span>' : '') +
    // The caption prints once. A picked photo still appears in the grid with its post, which
    // is where the caption belongs, so the feature page carries only date and place.
    (withCap && p.caption
      ? '<span class="gtext">' + esc(p.caption).replace(/\n/g, '<br>') + '</span>' : '') +
    '</div>';
  folio();
}

function openerPage() {
  addPage('full');
  page.innerHTML =
    '<img class="bleed" src="' + META.cover + '" alt="">' +
    '<div class="scrim"></div>' +
    '<div class="opener"><p class="kick">Winston and Eleanor</p>' +
    '<p class="yr">' + META.year + '</p>' +
    '<p class="sub">' + META.posts + ' posts &middot; ' + META.photos + ' photographs</p>' +
    '<p class="sub">' + META.range + '</p>' +
    (META.topics && META.topics.length
      ? '<ul class="topics">' + META.topics.map(t => '<li>' + t + '</li>').join('') + '</ul>'
      : '') + '</div>';
}

/* A hand-written route, as a strip across the head of a page. It is measured rather than
   given a page: seven lines of itinerary cannot carry 11x8in alone, and the trip reads
   better with its own first photographs underneath it. */
function routeBand(html, top, cls) {
  const b = document.createElement('div');
  b.className = cls || 'rtb';
  b.style.left = inch(M.left);
  b.style.width = inch(CW);
  b.style.top = inch(top);
  b.innerHTML = html;
  return b;
}

/* A route is one fixed size; a post whose photographs the archive lost is however long Cat
   wrote it. So a band is measured off the ruler before the page commits to carrying it. */
const bandCache = new Map();
function bandHeight(b) {
  let h = bandCache.get(b.html);
  if (h === undefined) {
    const d = routeBand(b.html, 0, b.cls);
    d.style.position = 'static';
    ruler.appendChild(d);
    h = d.getBoundingClientRect().height / 96 + BAND_GAP;
    ruler.removeChild(d);
    bandCache.set(b.html, h);
  }
  return h;
}

/* A route anchored past the last photograph of the volume still has to print. The 'full'
   marker keeps the page out of the audit that checks every photograph reached a page. */
function routePage(b) {
  addPage('full');
  page.appendChild(routeBand(b.html, M.top, b.cls));
  folio();
}

function layout() {
  openerPage();
  const gs = groups();
  const pending = [];                            // picks waiting for a page of their own
  const routes = (META.routes || []).slice();    // hand-written itineraries, in date order
  let i = 0, sinceHero = 0, lastFull = true;     // the opener is itself a full-bleed page
  while (i < gs.length) {
    // A route heads the trip it describes, so it takes the top of that trip's first page and
    // the photographs of the trip fill the rest of it.
    const band = [];
    while (routes.length && gs[i].post.iso >= routes[0].iso) band.push(routes.shift());
    // A band longer than the page can usefully share is given its own page rather than
    // squeezing the day's photographs into a strip at the foot of the sheet.
    let bandH = 0;
    for (const b of band) bandH += bandHeight(b);
    while (band.length && bandH > BAND_MAX) {
      routePage(band.shift());
      bandH = 0;
      for (const b of band) bandH += bandHeight(b);
    }
    // A feature page carries one photograph and no room for a band, so the rhythm waits a page.
    if (!band.length && !HEROES.size && !lastFull && sinceHero >= HERO_EVERY && heroOK(gs[i])) {
      heroPage(gs[i].post, gs[i].photos[0], 'rhythm', gs[i].lead);
      i++; sinceHero = 0; lastFull = true;
      continue;
    }
    addPage();
    folio();
    let top = M.top, budget = CH;
    for (const b of band) {
      page.appendChild(routeBand(b.html, top, b.cls));
      const h = bandHeight(b);
      top += h;
      budget -= h;
    }
    if (gs[i].monthStart) {
      page.appendChild(monthRule(gs[i].monthStart, top));
      top += MONTH_H;
      budget -= MONTH_H;
    }
    // A route page has to introduce its trip, so no photo page may straddle the anchor date.
    // The packer is shown only the groups in front of it; without this a page beginning on
    // the 19th ran on through the 24th and the route printed in the middle of its own trip.
    const bnd = routes.length ? gs.findIndex(g => g.post.iso >= routes[0].iso) : -1;
    const view = bnd > i ? gs.slice(0, bnd) : gs;
    let fill = fillPage(view, i, budget);
    // A photo that would be left alone on the next page has nowhere to go: rather than hand it
    // a full page it never earned, pull it back onto this one, even if this page then carries
    // less photograph than its best arrangement.
    if (fill.end < view.length) {
      const nxt = fillPage(view, fill.end, CH);
      if (nxt && nxt.rows.length === 1 && !nxt.rows[0].full && nxt.rows[0].n === 1) {
        const wider = fillPage(view, i, budget, fill.end + 1 - i);
        if (wider) fill = wider;
      }
    }
    // A single photo that cannot justify across the column would sit marooned in white,
    // so it takes the page full-bleed instead - unless a route band heads this page, since
    // going full-bleed drops the page and would take the band down with it.
    if (!band.length && fill.rows.length === 1 && !fill.rows[0].full && fill.rows[0].n === 1) {
      const g = fill.rows[0].gs[0];
      page.remove(); pageNo--;
      heroPage(g.post, g.photos[0], 'stranded', g.lead);
      i = fill.end; sinceHero = 0; lastFull = true;
      continue;
    }
    renderPage(fill, budget, top);
    for (let k = i; k < fill.end; k++) {
      for (const ph of gs[k].picks) pending.push({ post: gs[k].post, photo: ph });
    }
    i = fill.end;
    sinceHero++;
    lastFull = false;
    // At most one feature page per grid page, so two full-bleed pages never sit together -
    // the year opener followed straight by a feature read as a double.
    if (pending.length) {
      const pk = pending.shift();
      heroPage(pk.post, pk.photo, 'picked', false);
      lastFull = true;
    }
  }
  while (pending.length) {
    const pk = pending.shift();
    heroPage(pk.post, pk.photo, 'picked', false);
  }
  // A route anchored past the last post of the volume still has to print somewhere.
  while (routes.length) routePage(routes.shift());
  for (const html of (META.afterword || [])) {
    addPage('aw full');
    page.innerHTML = html;
    folio();
  }
}

/* Caption heights drive the packing and they are wrong until the fonts are in, which made the
   same book paginate differently from one run to the next. Waiting on document.fonts.ready is
   not enough: with no text on the page yet, nothing has requested a font, so it resolves
   immediately and layout still measures fallback metrics. Each face is therefore requested
   explicitly and awaited before a single row is packed. */
const FACES = ['300 16px Inter', '400 16px Inter', '300 16px Fraunces', '400 16px Fraunces'];

function run() {
  layout();
  document.body.dataset.pages = document.querySelectorAll('.page').length;
}

if (document.fonts && document.fonts.load) {
  Promise.all(FACES.map(f => document.fonts.load(f, 'Aa0')))
    .then(() => document.fonts.ready)
    .then(run, run);
} else {
  run();
}
</script>
</body></html>
